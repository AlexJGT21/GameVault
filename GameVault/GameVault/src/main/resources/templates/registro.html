
<th:block th:replace="~{layout/base :: layout(~{::title}, ~{::main})}">

    <title>GameVault - Registro de Usuario</title>

    <main class="container">
        <h2>Registro de Usuario</h2>

        <form th:action="@{/procesado/Usuario}" th:object="${usuario}" method="post">

            <div class="mb-3">
                <label for="username">Nombre de Usuario</label>
                <input type="text" id="username" th:field="*{nombre}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" th:field="*{correo}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{contrasenia}" class="form-control" required/>
            </div>

            <button type="submit" class="btn btn-success">Registrarse</button>
        </form>
    </main>

</th:block>
